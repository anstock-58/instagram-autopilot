name: KI-Support Autopilot - Reel (18:00)

on:
  schedule:
    - cron: '5 16 * * *'    # 16:05 UTC = 18:05 CEST (täglich, 10 min nach bus-reel)
  workflow_dispatch:         # Manuell auslösbar über GitHub UI

jobs:
  post-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pause prÃ¼fen
        id: pause_check
        run: |
          if [ -f "PAUSED" ]; then
            echo "paused=true" >> $GITHUB_OUTPUT
            echo "KI-Support Autopilot ist pausiert. Kein Post."
          else
            echo "paused=false" >> $GITHUB_OUTPUT
          fi

      - name: Reel verÃ¶ffentlichen
        if: steps.pause_check.outputs.paused == 'false'
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POST_TYPE: reel
          GITHUB_WORKSPACE: ${{ github.workspace }}
          TZ: Europe/Berlin
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/post-trigger-ki-support.ps1"

      - name: CSV-Status committen
        if: steps.pause_check.outputs.paused == 'false'
        run: |
          git config user.email "autopilot@github-actions"
          git config user.name "KI-Support Autopilot"
          git add outputs/contentplan_ki_support_*.csv || true
          git diff --staged --quiet || git commit -m "Auto: KI-Support Reel gepostet $(date +'%d.%m.%Y')"
          for i in 1 2 3; do
            git checkout -- . 2>/dev/null || true
            git pull --rebase origin master && git push && break
            echo "Push fehlgeschlagen (Versuch $i/3), warte 10s..."
            sleep 10
          done
