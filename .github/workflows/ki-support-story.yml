name: KI-Support Autopilot - Story (09:00)

on:
  schedule:
    - cron: '43 7 * * *'    # 07:43 UTC = 09:43 CEST (täglich)
    - cron: '57 8 * * *'    # Backup-Lauf (faengt verspaetete/uebersprungene GitHub-Schedule ab)
    - cron: '43 10 * * *'    # Backup-Lauf (faengt verspaetete/uebersprungene GitHub-Schedule ab)
  workflow_dispatch:

jobs:
  post-story:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pause pruefen
        id: pause_check
        run: |
          if [ -f "PAUSED" ]; then
            echo "paused=true" >> $GITHUB_OUTPUT
            echo "KI-Support Autopilot ist pausiert. Kein Post."
          else
            echo "paused=false" >> $GITHUB_OUTPUT
          fi

      - name: Story posten
        if: steps.pause_check.outputs.paused == 'false'
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POST_TYPE: story
          GITHUB_WORKSPACE: ${{ github.workspace }}
          TZ: Europe/Berlin
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/post-trigger-ki-support.ps1"

      - name: CSV-Status committen
        if: steps.pause_check.outputs.paused == 'false'
        run: |
          git config user.email "autopilot@github-actions"
          git config user.name "KI-Support Autopilot"
          git add outputs/contentplan_ki_support_*.csv || true
          git diff --staged --quiet || git commit -m "Auto: KI-Support Story gepostet $(date +'%d.%m.%Y')"
          for i in 1 2 3; do
            git checkout -- . 2>/dev/null || true
            git pull --rebase origin master && git push && break
            echo "Push fehlgeschlagen (Versuch $i/3), warte 10s..."
            sleep 10
          done
