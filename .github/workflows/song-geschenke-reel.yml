name: Song-Geschenke Autopilot - Reel (18:00)

on:
  # PAUSIERT bis 16.07.2026 - Blotato Credits aufgebraucht
  # schedule:
  #   - cron: '57 15 * * *'   # 15:57 UTC = 17:57 CEST (täglich)
  #   - cron: '41 17 * * *'   # Backup-Lauf
  #   - cron: '27 19 * * *'   # Backup-Lauf
  workflow_dispatch:

jobs:
  post-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pause pruefen
        id: pause_check
        run: |
          if [ -f "PAUSED" ]; then
            echo "paused=true" >> $GITHUB_OUTPUT
            echo "Song-Geschenke Autopilot ist pausiert. Kein Post."
          else
            echo "paused=false" >> $GITHUB_OUTPUT
          fi

      - name: Reel veroeffentlichen
        if: steps.pause_check.outputs.paused == 'false'
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SONG_GESCHENKE_ACCOUNT_ID: ${{ secrets.SONG_GESCHENKE_ACCOUNT_ID }}
          POST_TYPE: reel
          GITHUB_WORKSPACE: ${{ github.workspace }}
          TZ: Europe/Berlin
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/post-trigger-song-geschenke.ps1"

      - name: CSV-Status committen
        if: steps.pause_check.outputs.paused == 'false'
        run: |
          git config user.email "autopilot@github-actions"
          git config user.name "Song-Geschenke Autopilot"
          git add outputs/contentplan_song_geschenke_*.csv || true
          git diff --staged --quiet || git commit -m "Auto: Song-Geschenke Reel gepostet $(date +'%d.%m.%Y')"
          for i in 1 2 3; do
            git checkout -- . 2>/dev/null || true
            git pull --rebase origin master && git push && break
            echo "Push fehlgeschlagen (Versuch $i/3), warte 10s..."
            sleep 10
          done
