name: TAC Post Trigger

on:
  schedule:
    # 17:55 Uhr CEST (Sommerzeit = UTC+2, also 15:55 UTC)
    # Im Winter (CET = UTC+1) auf '55 16 * * *' aendern
    - cron: '55 15 * * *'
  workflow_dispatch:  # Manueller Start über GitHub UI jederzeit möglich

jobs:
  post-trigger-tac:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: TAC Post-Trigger ausführen
        shell: pwsh
        env:
          TAC_WEBHOOK_URL: ${{ secrets.TAC_WEBHOOK_URL }}
        run: ./scripts/post-trigger-tac.ps1
