name: Andi-mit-System Autopilot - Reel (18:00)

on:
  schedule:
    - cron: '25 16 * * *'   # 16:25 UTC = 18:25 CEST (täglich)
    - cron: '7 18 * * *'    # Backup-Lauf (faengt verspaetete/uebersprungene GitHub-Schedule ab)
    - cron: '53 19 * * *'    # Backup-Lauf (faengt verspaetete/uebersprungene GitHub-Schedule ab)
  workflow_dispatch:         # Manuell auslösbar über GitHub UI

jobs:
  post-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pause prÃ¼fen
        id: pause_check
        run: |
          if [ -f "PAUSED" ]; then
            echo "paused=true" >> $GITHUB_OUTPUT
            echo "Andi-mit-System Autopilot ist pausiert. Kein Post."
          else
            echo "paused=false" >> $GITHUB_OUTPUT
          fi

      - name: Reel verÃ¶ffentlichen
        if: steps.pause_check.outputs.paused == 'false'
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POST_TYPE: reel
          GITHUB_WORKSPACE: ${{ github.workspace }}
          TZ: Europe/Berlin
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/post-trigger-andi-mit-system.ps1"

      - name: CSV-Status committen
        if: steps.pause_check.outputs.paused == 'false'
        run: |
          git config user.email "autopilot@github-actions"
          git config user.name "Andi-mit-System Autopilot"
          git add outputs/contentplan_andi_mit_system_*.csv || true
          git diff --staged --quiet || git commit -m "Auto: Andi-mit-System Reel gepostet $(date +'%d.%m.%Y')"
          for i in 1 2 3; do
            git checkout -- . 2>/dev/null || true
            git pull --rebase origin master && git push && break
            echo "Push fehlgeschlagen (Versuch $i/3), warte 10s..."
            sleep 10
          done
