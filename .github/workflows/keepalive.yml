name: Keepalive — GitHub Actions aktiv halten

on:
  schedule:
    - cron: '0 4 * * 1'   # Jeden Montag 04:00 UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keepalive commit
        run: |
          git config user.email "autopilot@github-actions"
          git config user.name "Instagram Autopilot"
          echo "$(date +'%Y-%m-%d %H:%M:%S') keepalive" >> .keepalive
          git add .keepalive
          git commit -m "Keepalive: $(date +'%d.%m.%Y')"
          git push
