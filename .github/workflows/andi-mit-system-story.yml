name: Andi-mit-System Autopilot - Story (09:00)

on:
  workflow_dispatch:         # Getriggert von cron-job.org (09:00 Europe/Berlin)

jobs:
  post-story:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pause pruefen
        id: pause_check
        run: |
          if [ -f "PAUSED" ]; then
            echo "paused=true" >> $GITHUB_OUTPUT
            echo "Andi-mit-System Autopilot ist pausiert. Kein Post."
          else
            echo "paused=false" >> $GITHUB_OUTPUT
          fi

      - name: Story posten
        if: steps.pause_check.outputs.paused == 'false'
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POST_TYPE: story
          GITHUB_WORKSPACE: ${{ github.workspace }}
          TZ: Europe/Berlin
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/post-trigger-andi-mit-system.ps1"

      - name: CSV-Status committen
        if: steps.pause_check.outputs.paused == 'false'
        run: |
          git config user.email "autopilot@github-actions"
          git config user.name "Andi-mit-System Autopilot"
          git add outputs/contentplan_andi_mit_system_*.csv || true
          git diff --staged --quiet || git commit -m "Auto: Andi-mit-System Story gepostet $(date +'%d.%m.%Y')"
          for i in 1 2 3; do
            git checkout -- . 2>/dev/null || true
            git pull --rebase origin master && git push && break
            echo "Push fehlgeschlagen (Versuch $i/3), warte 10s..."
            sleep 10
          done
