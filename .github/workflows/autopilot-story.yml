name: Instagram Autopilot - Story (09:00)

on:
  workflow_dispatch:         # Nur manuell — ersetzt durch bus-story.yml

jobs:
  post-story:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pause prüfen
        id: pause_check
        run: |
          if [ -f "PAUSED" ]; then
            echo "paused=true" >> $GITHUB_OUTPUT
            echo "Autopilot ist pausiert. Kein Post."
          else
            echo "paused=false" >> $GITHUB_OUTPUT
          fi

      - name: Story posten
        if: steps.pause_check.outputs.paused == 'false'
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/post-trigger.ps1"

      - name: CSV-Status committen
        if: steps.pause_check.outputs.paused == 'false'
        run: |
          git config user.email "autopilot@github-actions"
          git config user.name "Instagram Autopilot"
          git add outputs/contentplan_juni_v1.csv outputs/contentplan_mai_v2.csv || true
          git diff --staged --quiet || git commit -m "Auto: Story gepostet $(date +'%d.%m.%Y')"
          for i in 1 2 3; do
            git checkout -- . 2>/dev/null || true
            git pull --rebase origin master && git push && break
            echo "Push fehlgeschlagen (Versuch $i/3), warte 10s..."
            sleep 10
          done
