name: Instagram Autopilot - Reel (18:00 CEST)

on:
  schedule:
    - cron: '55 15 * * *'   # 15:55 UTC = 17:55 CEST (Sommer) / 16:55 MEZ (Winter)
  workflow_dispatch:          # Manuell auslösbar über GitHub UI

jobs:
  post-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pause prüfen
        id: pause_check
        run: |
          if [ -f "PAUSED" ]; then
            echo "paused=true" >> $GITHUB_OUTPUT
            echo "Autopilot pausiert. Kein Post."
          else
            echo "paused=false" >> $GITHUB_OUTPUT
          fi

      - name: Reel posten
        if: steps.pause_check.outputs.paused == 'false'
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          TZ: Europe/Berlin        # Wichtig: Zeitzone für korrekte Zeitfenster-Berechnung
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/post-trigger.ps1"

      - name: CSV-Status committen
        if: steps.pause_check.outputs.paused == 'false'
        run: |
          git config user.email "autopilot@github-actions"
          git config user.name "Instagram Autopilot"
          git add outputs/contentplan_*.csv || true
          git diff --staged --quiet || git commit -m "Auto: Reel gepostet $(date +'%d.%m.%Y')"
          git push
