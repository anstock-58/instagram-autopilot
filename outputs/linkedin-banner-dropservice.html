<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1584px; height: 396px; overflow: hidden; }

  .banner {
    width: 1584px;
    height: 396px;
    background: linear-gradient(135deg, #0a0e1a 0%, #0d1b2e 50%, #0a1628 100%);
    display: flex;
    align-items: center;
    padding: 0 80px;
    position: relative;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  /* Hintergrund-Akzente */
  .banner::before {
    content: '';
    position: absolute;
    top: -100px;
    right: 200px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0, 120, 255, 0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  .banner::after {
    content: '';
    position: absolute;
    bottom: -80px;
    right: 100px;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(0, 200, 180, 0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .left-accent {
    width: 5px;
    height: 120px;
    background: linear-gradient(180deg, #00c8b4, #0078ff);
    border-radius: 3px;
    margin-right: 40px;
    flex-shrink: 0;
  }

  .text-block {
    z-index: 1;
  }

  .main-headline {
    font-size: 58px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 14px;
  }

  .main-headline span {
    color: #00c8b4;
  }

  .sub-headline {
    font-size: 24px;
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.5px;
  }

  .cta {
    position: absolute;
    right: 80px;
    bottom: 40px;
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 1;
  }

  .cta span {
    color: #00c8b4;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="left-accent"></div>
  <div class="text-block">
    <div class="main-headline"><span>60</span> Instagram Posts / Monat</div>
    <div class="sub-headline">Vollautomatisch &nbsp;·&nbsp; KI-erstellt &nbsp;·&nbsp; Du machst nichts.</div>
  </div>
  <div class="cta">Schreib mir <span>DEMO</span></div>
</div>
</body>
</html>
