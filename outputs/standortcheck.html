<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neustart-Check | Andreas Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#1a1a2e;
    --gold:#c9a84c;
    --gold-l:#e2c06e;
    --gold-dim:rgba(201,168,76,0.12);
    --text:#f0ece4;
    --text-soft:#d4cfc6;
    --muted:#a09890;
    --card:rgba(255,255,255,0.06);
    --input-bg:rgba(15,10,30,0.7);
    --border:rgba(201,168,76,0.25);
  }
  body {
    font-family:'DM Sans',sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:2rem 1rem;
    position:relative; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(201,168,76,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(100,50,120,0.09) 0%, transparent 60%);
  }
  .wrap { width:100%; max-width:660px; position:relative; z-index:1; }

  /* Header */
  .hdr { text-align:center; margin-bottom:2rem; }
  .lbl { font-size:.68rem; letter-spacing:.22em; text-transform:uppercase;
         color:var(--gold); margin-bottom:.9rem; display:block; }
  h1 { font-family:'Playfair Display',serif; font-size:clamp(2.2rem,5.5vw,3.2rem);
       font-weight:700; line-height:1.1; letter-spacing:-.02em; margin-bottom:.6rem;
       color:var(--text); }
  h1 span { color:var(--gold); font-style:italic; }
  .divider { width:44px; height:1px; background:var(--gold); margin:.8rem auto 1rem; opacity:.5; }
  .sub { font-size:1rem; color:var(--text-soft); font-weight:300; }

  .section { display:none; }
  .section.visible { display:block; }

  /* Input box */
  .ibox { background:var(--input-bg); border:1px solid var(--border); border-radius:14px;
          backdrop-filter:blur(16px); overflow:hidden; }
  .ibox-inner { padding:1.25rem 1.5rem; }
  .ibox-footer { display:flex; align-items:center; justify-content:space-between;
                 padding:.7rem 1.4rem; border-top:1px solid var(--border); }

  /* Checkboxes */
  .sec-label { font-size:.68rem; letter-spacing:.15em; text-transform:uppercase;
               color:var(--gold); margin-bottom:.85rem; display:block; }
  .cb-group { display:flex; flex-direction:column; gap:.3rem; margin-bottom:1rem; }
  .cb-item { display:flex; align-items:flex-start; gap:.8rem; cursor:pointer;
             padding:.5rem .65rem; border-radius:8px; transition:background .2s; }
  .cb-item:hover { background:rgba(201,168,76,.07); }
  .cb-item input[type=checkbox] { opacity:0; position:absolute; width:1px; height:1px; pointer-events:none; }
  .cb-box { width:19px; height:19px; border:1.5px solid rgba(201,168,76,.4); border-radius:4px;
            flex-shrink:0; margin-top:1px; display:flex; align-items:center;
            justify-content:center; transition:all .2s; background:rgba(255,255,255,.03); }
  .cb-item input:checked ~ .cb-box { background:var(--gold); border-color:var(--gold); }
  .cb-item input:checked ~ .cb-box::after { content:"✓"; font-size:.75rem; color:#1a1a2e; font-weight:700; }
  .cb-item input:checked ~ .cb-text { color:var(--text); }
  .cb-text { font-size:.95rem; color:var(--text-soft); line-height:1.5; transition:color .2s; user-select:none; }

  /* Signal bar */
  .signal-bar { margin:.75rem 0; padding:.8rem 1rem; border-radius:8px;
                background:rgba(201,168,76,0.09); border:1px solid rgba(201,168,76,0.2);
                display:flex; align-items:center; gap:.75rem;
                opacity:0; transform:translateY(6px); transition:all .35s; }
  .signal-bar.visible { opacity:1; transform:translateY(0); }
  .signal-count { font-family:'Playfair Display',serif; font-size:1.6rem;
                  font-weight:700; color:var(--gold); line-height:1; min-width:26px; }
  .signal-txt { font-size:.88rem; color:var(--text-soft); line-height:1.4; flex:1; }
  .signal-txt strong { color:var(--text); font-weight:500; }
  .signal-dots { display:flex; gap:4px; }
  .signal-dot { width:9px; height:9px; border-radius:50%;
                background:rgba(201,168,76,.2); transition:background .3s; }
  .signal-dot.on { background:var(--gold); }

  /* Separator */
  .sep { display:flex; align-items:center; gap:.75rem; margin:.9rem 0; }
  .sep-line { flex:1; height:1px; background:var(--border); }
  .sep-txt { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }

  textarea { width:100%; background:transparent; border:none; outline:none;
             color:var(--text); font-family:'DM Sans',sans-serif; font-size:.98rem;
             font-weight:300; line-height:1.7; resize:none; min-height:95px; }
  textarea::placeholder { color:rgba(200,195,185,.35); font-style:italic; }

  .hint { font-size:.72rem; color:var(--muted); }

  /* Buttons */
  .btn { font-family:'DM Sans',sans-serif; font-size:.88rem; font-weight:500;
         letter-spacing:.04em; color:#1a1a2e; background:var(--gold); border:none;
         padding:.7rem 1.9rem; border-radius:7px; cursor:pointer;
         transition:background .2s, transform .15s; }
  .btn:hover { background:var(--gold-l); transform:translateY(-1px); }
  .btn:active { transform:translateY(0); }
  .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--muted);
               font-family:'DM Sans',sans-serif; font-size:.78rem; padding:.45rem 1.1rem;
               border-radius:6px; cursor:pointer; transition:color .2s, border-color .2s;
               display:block; margin:.9rem auto 0; }
  .btn-ghost:hover { color:var(--text); border-color:rgba(201,168,76,.4); }

  /* Result */
  .r-head { text-align:center; margin-bottom:1.75rem; }
  .r-lbl { font-size:.68rem; letter-spacing:.18em; text-transform:uppercase;
           color:var(--gold); margin-bottom:.4rem; display:block; }
  .r-title { font-family:'Playfair Display',serif; font-size:1.4rem;
             font-weight:600; font-style:italic; color:var(--text); }

  .card { background:var(--card); border:1px solid var(--border); border-radius:11px;
          padding:1.4rem 1.65rem; margin-bottom:.85rem;
          opacity:0; transform:translateY(14px); animation:fadeUp .5s ease forwards; }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
  .card:nth-child(1) { animation-delay:.08s; }
  .card:nth-child(2) { animation-delay:.22s; }
  .card:nth-child(3) { animation-delay:.36s; }
  .card:nth-child(4) { animation-delay:.50s; }

  .c-lbl { font-size:.63rem; letter-spacing:.17em; text-transform:uppercase;
           color:var(--gold); margin-bottom:.65rem; font-weight:500; display:block; opacity:.75; }
  .c-txt { font-size:.98rem; line-height:1.75; font-weight:300; color:var(--text-soft); }
  .sig-list { list-style:none; display:flex; flex-direction:column; gap:.6rem; }
  .sig-list li { display:flex; gap:.75rem; align-items:flex-start;
                 font-size:.98rem; line-height:1.6; font-weight:300; color:var(--text-soft); }
  .sig-list li::before { content:"—"; color:var(--gold); flex-shrink:0; margin-top:.05em; }
  .card.botschaft { background:var(--gold-dim); border-color:rgba(201,168,76,.4); }
  .card.botschaft .c-txt { font-family:'Playfair Display',serif; font-style:italic;
                            font-size:1.05rem; color:var(--gold-l); }

  /* CTA */
  .cta { text-align:center; margin-top:2rem; padding:2rem;
         border-top:1px solid var(--border);
         opacity:0; animation:fadeUp .5s ease .65s forwards; }
  .cta-txt { font-size:.93rem; color:var(--text-soft); margin-bottom:.9rem;
             font-weight:300; line-height:1.6; }
  .cta-intro { font-size:.93rem; color:var(--text-soft); line-height:1.8; font-weight:300;
               margin-bottom:1.5rem; text-align:left; padding:1.1rem 1.25rem;
               background:rgba(255,255,255,0.03); border-left:2px solid rgba(201,168,76,.45);
               border-radius:0 8px 8px 0; }
  .cta-links { display:flex; flex-direction:column; gap:.6rem; align-items:center; margin-bottom:1rem; }
  .cta-link { display:block; width:100%; max-width:380px; padding:.85rem 1.6rem;
              border-radius:8px; text-decoration:none; font-family:'DM Sans',sans-serif;
              font-size:.88rem; font-weight:500; letter-spacing:.03em;
              transition:all .2s; text-align:center; }
  .cta-link.primary { background:var(--gold); color:#1a1a2e; }
  .cta-link.primary:hover { background:var(--gold-l); transform:translateY(-1px); }
  .cta-link.secondary { background:transparent; border:1px solid rgba(201,168,76,.45); color:var(--gold); }
  .cta-link.secondary:hover { background:rgba(201,168,76,.08); transform:translateY(-1px); }
  .cta-link-label { font-size:.63rem; letter-spacing:.12em; text-transform:uppercase;
                    opacity:.65; display:block; margin-bottom:.25rem; }
  .pdf-btn { background:transparent; border:1px solid var(--border); color:var(--text-soft);
             font-family:'DM Sans',sans-serif; font-size:.82rem; padding:.55rem 1.5rem;
             border-radius:7px; cursor:pointer; transition:all .2s; }
  .pdf-btn:hover { color:var(--text); border-color:rgba(201,168,76,.45); }
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <span class="lbl">Persönliche Analyse</span>
    <h1>Neustart-<span>Check</span></h1>
    <div class="divider"></div>
    <p class="sub">Wo stehst du gerade — wirklich?</p>
  </div>

  <div class="section visible" id="s0">
    <div class="ibox">
      <div class="ibox-inner">
        <span class="sec-label">Was ist in den letzten vier Wochen häufiger geworden?</span>
        <div class="cb-group" id="cbGroup">
          <label class="cb-item">
            <input type="checkbox" id="cb1">
            <div class="cb-box"></div>
            <span class="cb-text">Abends schwer abschalten, obwohl alles erledigt ist</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb2">
            <div class="cb-box"></div>
            <span class="cb-text">Mehr Gereiztheit bei Kleinigkeiten</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb3">
            <div class="cb-box"></div>
            <span class="cb-text">Körper meldet sich: Verspannung, Druck, Unruhe</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb4">
            <div class="cb-box"></div>
            <span class="cb-text">Beschäftigt, aber innerlich nicht zufrieden</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb5">
            <div class="cb-box"></div>
            <span class="cb-text">Funktioniere nach außen, aber innen ist es laut</span>
          </label>
        </div>

        <div class="signal-bar" id="signalBar">
          <div class="signal-count" id="signalCount">0</div>
          <div class="signal-txt" id="signalTxt"><strong>von 5 Signalen</strong> erkannt</div>
          <div class="signal-dots">
            <div class="signal-dot"></div><div class="signal-dot"></div>
            <div class="signal-dot"></div><div class="signal-dot"></div>
            <div class="signal-dot"></div>
          </div>
        </div>

        <div class="sep">
          <div class="sep-line"></div>
          <span class="sep-txt">Deine Situation</span>
          <div class="sep-line"></div>
        </div>

        <textarea id="userInput" rows="4"
          placeholder="Im Moment kostet mich am meisten Energie: Was läuft nicht mehr rund? Was fühlt sich falsch an?"></textarea>
      </div>
      <div class="ibox-footer">
        <span class="hint">Sei ehrlich — kein richtig oder falsch</span>
        <button class="btn" onclick="startCheck()">Meinen Check starten</button>
      </div>
    </div>
  </div>

  <div class="section" id="s1"></div>
</div>

function updateSignals() {
  const n = document.querySelectorAll("#cbGroup input:checked").length;
  document.getElementById("signalCount").textContent = n;
  document.getElementById("signalTxt").innerHTML = n === 0
    ? "<strong>von 5 Signalen</strong> erkannt"
    : SIGNAL_MSGS[n] + ' <span style="opacity:.45;font-size:.8em">(' + n + "/5)</span>";
  document.querySelectorAll(".signal-dot").forEach((d, i) => d.classList.toggle("on", i < n));
  document.getElementById("signalBar").classList.toggle("visible", n > 0);
}

function startCheck() {
  const text = document.getElementById("userInput").value.trim();
  const checked = [...document.querySelectorAll("#cbGroup input:checked")]
    .map(cb => parseInt(cb.id.replace("cb","")) - 1);
  if (text.length < 3 && checked.length === 0) {
    alert("Bitte beschreibe kurz deine Situation oder kreuze mindestens einen Punkt an.");
    return;
  }
  const result = analyse(checked, text);
  showResult(result);
}

function analyse(checked, text) {
  const n = checked.length;
  const t = text.toLowerCase();
  const einschaetzung = EINSCHAETZUNGEN[Math.min(n, 5)];

  // Signale aus Checkboxen + Fallbacks
  const signale = [];
  [0,1,2,3,4].forEach(i => { if (checked.includes(i)) signale.push(SIGNALE_POOL[i]); });
  let fi = 5;
  while (signale.length < 3) { signale.push(SIGNALE_POOL[fi % SIGNALE_POOL.length]); fi++; }

  // Nächster Schritt
  let schritt = SCHRITTE.basis;
  if (checked.includes(2) || t.includes("körper") || t.includes("verspann") || t.includes("schlaf"))
    schritt = SCHRITTE.koerper;
  else if (checked.includes(0) || t.includes("gedanken") || t.includes("kopf") || t.includes("grübel"))
    schritt = SCHRITTE.mental;
  else if (checked.includes(3) || t.includes("sinn") || t.includes("freude") || t.includes("zufried"))
    schritt = SCHRITTE.sinn;

  const botschaft = BOTSCHAFTEN[n % BOTSCHAFTEN.length];
  return { einschaetzung, signale: signale.slice(0,3), schritt, botschaft };
}

  show("s0", false);
  document.getElementById("s1").innerHTML = `

      <div class="c-txt">${esc(d.einschaetzung)}</div>
    </div>
    <div class="card">
      <span class="c-lbl">Drei Signale, die ich erkenne</span>
      <ul class="sig-list">${d.signale.map(s => "<li>" + esc(s) + "</li>").join("")}</ul>
    </div>
    <div class="card">
      <span class="c-lbl">Dein nächster Schritt</span>
      <div class="c-txt">${esc(d.schritt)}</div>
    </div>
    <div class="card botschaft">
      <div class="c-txt">${esc(d.botschaft)}</div>
    </div>
    <div class="cta">
      <p class="cta-txt">Dein persönliches Workbook — alle sechs Kapitel zum Ausfüllen, kostenlos.</p>
      <button class="btn" onclick="downloadPDF()" style="margin-bottom:2rem;">↓ Workbook jetzt herunterladen</button>
      <div class="sep" style="margin-bottom:1.5rem;">
        <div class="sep-line"></div>
        <span class="sep-txt">Dein nächster Schritt</span>
        <div class="sep-line"></div>
      </div>
      <p class="cta-intro">
        Der Check hat dir gezeigt, wo du stehst. Aber Klarheit allein verändert nichts —
        entscheidend ist, was du jetzt damit machst. Der Minikurs gibt dir in kurzen,
        konkreten Einheiten genau das Werkzeug, das du brauchst, um aus dem Funktionsmodus
        herauszukommen: ohne großen Aufwand, ohne leere Versprechen, direkt anwendbar im Alltag.
      </p>
      <div class="cta-links">
        <a class="cta-link primary" href="https://sicher-weiterlesen.com/raus-aus-dem-funktionsmodus" target="_blank" rel="noopener">
          <span class="cta-link-label">Empfohlener nächster Schritt</span>
          Minikurs: Raus aus dem Funktionsmodus →
        </a>
        <a class="cta-link secondary" href="https://sicher-weiterlesen.com/neustart-im-kopf" target="_blank" rel="noopener">
          <span class="cta-link-label">Für mehr Tiefe</span>
          Hauptkurs: Neustart im Kopf →
        </a>
      </div>
      <button class="btn-ghost" onclick="resetTool()">← Neuer Check</button>
    </div>`;
  show("s1", true);
}

function downloadPDF() {
  const b = atob(PDF_B64);
  const arr = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) arr[i] = b.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], {type:"application/pdf"}));
  const a = document.createElement("a");
  a.href = url; a.download = "Neustart-Workbook.pdf"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function resetTool() {
  document.getElementById("s1").innerHTML = "";
  show("s1", false); show("s0", true);
  document.getElementById("userInput").value = "";
  document.querySelectorAll("#cbGroup input").forEach(i => i.checked = false);
  updateSignals();
}

function show(id, on) { document.getElementById(id).classList.toggle("visible", on); }
function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Mobile-Fix: Checkbox-State explizit per JS steuern (iOS Safari)
document.querySelectorAll('#cbGroup .cb-item').forEach(function(label) {
  label.addEventListener('click', function(e) {
    e.preventDefault();
    var input = label.querySelector('input[type=checkbox]');
    input.checked = !input.checked;
    updateSignals();
  });
});
</script>
</body>
