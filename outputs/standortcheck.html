<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neustart-Check | Andreas Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="window._jspdfFailed=true"></script>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#1a1a2e;
    --gold:#c9a84c;
    --gold-l:#e2c06e;
    --gold-dim:rgba(201,168,76,0.12);
    --text:#f0ece4;
    --text-soft:#d4cfc6;
    --muted:#a09890;
    --card:rgba(255,255,255,0.06);
    --input-bg:rgba(15,10,30,0.7);
    --border:rgba(201,168,76,0.25);
  }
  body {
    font-family:'DM Sans',sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:2rem 1rem;
    position:relative; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(201,168,76,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(100,50,120,0.09) 0%, transparent 60%);
  }
  .wrap { width:100%; max-width:660px; position:relative; z-index:1; }

  /* Progress */
  .progress { margin-bottom:2rem; text-align:center; }
  .progress-steps { display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:.5rem; }
  .step { width:10px; height:10px; border-radius:50%; background:rgba(201,168,76,.2);
          border:1.5px solid rgba(201,168,76,.3); transition:all .3s; flex-shrink:0; }
  .step.active { background:var(--gold); border-color:var(--gold); transform:scale(1.25); }
  .step.done { background:rgba(201,168,76,.5); border-color:rgba(201,168,76,.5); }
  .step-line { width:40px; height:1px; background:rgba(201,168,76,.2); flex-shrink:0; }
  .progress-label { font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

  /* Header */
  .hdr { text-align:center; margin-bottom:2rem; }
  .lbl { font-size:.68rem; letter-spacing:.22em; text-transform:uppercase;
         color:var(--gold); margin-bottom:.9rem; display:block; }
  h1 { font-family:'Playfair Display',serif; font-size:clamp(2.2rem,5.5vw,3.2rem);
       font-weight:700; line-height:1.1; letter-spacing:-.02em; margin-bottom:.6rem;
       color:var(--text); }
  h1 span { color:var(--gold); font-style:italic; }
  .divider { width:44px; height:1px; background:var(--gold); margin:.8rem auto 1rem; opacity:.5; }
  .sub { font-size:1rem; color:var(--text-soft); font-weight:300; }

  .section { display:none; }
  .section.visible { display:block; }

  /* Input box */
  .ibox { background:var(--input-bg); border:1px solid var(--border); border-radius:14px;
          backdrop-filter:blur(16px); overflow:hidden; }
  .ibox-inner { padding:1.25rem 1.5rem; }
  .ibox-footer { display:flex; align-items:center; justify-content:space-between;
                 padding:.7rem 1.4rem; border-top:1px solid var(--border); }
  .ibox-footer.with-back { justify-content:space-between; }

  /* Checkboxes */
  .sec-label { font-size:.68rem; letter-spacing:.15em; text-transform:uppercase;
               color:var(--gold); margin-bottom:.85rem; display:block; }
  .cb-group { display:flex; flex-direction:column; gap:.3rem; margin-bottom:1rem; }
  .cb-item { display:flex; align-items:flex-start; gap:.8rem; cursor:pointer;
             padding:.5rem .65rem; border-radius:8px; transition:background .2s; }
  .cb-item:hover { background:rgba(201,168,76,.07); }
  .cb-item input[type=checkbox] { opacity:0; position:absolute; width:1px; height:1px; pointer-events:none; }
  .cb-box { width:19px; height:19px; border:1.5px solid rgba(201,168,76,.4); border-radius:4px;
            flex-shrink:0; margin-top:1px; display:flex; align-items:center;
            justify-content:center; transition:all .2s; background:rgba(255,255,255,.03); }
  .cb-item input:checked ~ .cb-box { background:var(--gold); border-color:var(--gold); }
  .cb-item input:checked ~ .cb-box::after { content:"✓"; font-size:.75rem; color:#1a1a2e; font-weight:700; }
  .cb-item input:checked ~ .cb-text { color:var(--text); }
  .cb-text { font-size:.95rem; color:var(--text-soft); line-height:1.5; transition:color .2s; user-select:none; }

  /* Signal bar */
  .signal-bar { margin:.75rem 0; padding:.8rem 1rem; border-radius:8px;
                background:rgba(201,168,76,0.09); border:1px solid rgba(201,168,76,0.2);
                display:flex; align-items:center; gap:.75rem;
                opacity:0; transform:translateY(6px); transition:all .35s; }
  .signal-bar.visible { opacity:1; transform:translateY(0); }
  .signal-count { font-family:'Playfair Display',serif; font-size:1.6rem;
                  font-weight:700; color:var(--gold); line-height:1; min-width:26px; }
  .signal-txt { font-size:.88rem; color:var(--text-soft); line-height:1.4; flex:1; }
  .signal-txt strong { color:var(--text); font-weight:500; }
  .signal-dots { display:flex; gap:4px; }
  .signal-dot { width:9px; height:9px; border-radius:50%;
                background:rgba(201,168,76,.2); transition:background .3s; }
  .signal-dot.on { background:var(--gold); }

  /* Separator */
  .sep { display:flex; align-items:center; gap:.75rem; margin:.9rem 0; }
  .sep-line { flex:1; height:1px; background:var(--border); }
  .sep-txt { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }

  textarea { width:100%; background:transparent; border:none; outline:none;
             color:var(--text); font-family:'DM Sans',sans-serif; font-size:.98rem;
             font-weight:300; line-height:1.7; resize:none; min-height:95px; }
  textarea::placeholder { color:rgba(200,195,185,.35); font-style:italic; }

  .hint { font-size:.72rem; color:var(--muted); }

  /* Buttons */
  .btn { font-family:'DM Sans',sans-serif; font-size:.88rem; font-weight:500;
         letter-spacing:.04em; color:#1a1a2e; background:var(--gold); border:none;
         padding:.7rem 1.9rem; border-radius:7px; cursor:pointer;
         transition:background .2s, transform .15s; }
  .btn:hover { background:var(--gold-l); transform:translateY(-1px); }
  .btn:active { transform:translateY(0); }
  .btn-back { background:transparent; border:1px solid var(--border); color:var(--muted);
              font-family:'DM Sans',sans-serif; font-size:.78rem; padding:.45rem 1.1rem;
              border-radius:6px; cursor:pointer; transition:color .2s, border-color .2s; }
  .btn-back:hover { color:var(--text); border-color:rgba(201,168,76,.4); }
  .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--muted);
               font-family:'DM Sans',sans-serif; font-size:.78rem; padding:.45rem 1.1rem;
               border-radius:6px; cursor:pointer; transition:color .2s, border-color .2s;
               display:block; margin:.9rem auto 0; }
  .btn-ghost:hover { color:var(--text); border-color:rgba(201,168,76,.4); }

  /* Result */
  .r-head { text-align:center; margin-bottom:1.75rem; }
  .r-lbl { font-size:.68rem; letter-spacing:.18em; text-transform:uppercase;
           color:var(--gold); margin-bottom:.4rem; display:block; }
  .r-title { font-family:'Playfair Display',serif; font-size:1.4rem;
             font-weight:600; font-style:italic; color:var(--text); }

  .card { background:var(--card); border:1px solid var(--border); border-radius:11px;
          padding:1.4rem 1.65rem; margin-bottom:.85rem;
          opacity:0; transform:translateY(14px); animation:fadeUp .5s ease forwards; }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
  .card:nth-child(1) { animation-delay:.08s; }
  .card:nth-child(2) { animation-delay:.22s; }
  .card:nth-child(3) { animation-delay:.36s; }
  .card:nth-child(4) { animation-delay:.50s; }
  .card:nth-child(5) { animation-delay:.64s; }
  .card:nth-child(6) { animation-delay:.78s; }

  .c-lbl { font-size:.63rem; letter-spacing:.17em; text-transform:uppercase;
           color:var(--gold); margin-bottom:.65rem; font-weight:500; display:block; opacity:.75; }
  .c-txt { font-size:.98rem; line-height:1.75; font-weight:300; color:var(--text-soft); }
  .dim-score { display:flex; align-items:center; gap:.6rem; margin-bottom:.75rem; }
  .dim-dots { display:flex; gap:4px; }
  .dim-dot { width:9px; height:9px; border-radius:50%; background:rgba(201,168,76,.15); }
  .dim-dot.on-low { background:rgba(201,168,76,.45); }
  .dim-dot.on-mid { background:var(--gold); }
  .dim-dot.on-high { background:#e87c4e; }
  .dim-label { font-size:.72rem; color:var(--muted); }
  .card.botschaft { background:var(--gold-dim); border-color:rgba(201,168,76,.4); }
  .card.botschaft .c-txt { font-family:'Playfair Display',serif; font-style:italic;
                            font-size:1.05rem; color:var(--gold-l); }

  /* CTA */
  .cta { text-align:center; margin-top:2rem; padding:2rem;
         border-top:1px solid var(--border);
         opacity:0; animation:fadeUp .5s ease .9s forwards; }
  .cta-txt { font-size:.93rem; color:var(--text-soft); margin-bottom:.9rem;
             font-weight:300; line-height:1.6; }
  .cta-intro { font-size:.93rem; color:var(--text-soft); line-height:1.8; font-weight:300;
               margin-bottom:1.5rem; text-align:left; padding:1.1rem 1.25rem;
               background:rgba(255,255,255,0.03); border-left:2px solid rgba(201,168,76,.45);
               border-radius:0 8px 8px 0; }
  .cta-links { display:flex; flex-direction:column; gap:.6rem; align-items:center; margin-bottom:1rem; }
  .cta-link { display:block; width:100%; max-width:380px; padding:.85rem 1.6rem;
              border-radius:8px; text-decoration:none; font-family:'DM Sans',sans-serif;
              font-size:.88rem; font-weight:500; letter-spacing:.03em;
              transition:all .2s; text-align:center; }
  .cta-link.primary { background:var(--gold); color:#1a1a2e; }
  .cta-link.primary:hover { background:var(--gold-l); transform:translateY(-1px); }
  .cta-link.secondary { background:transparent; border:1px solid rgba(201,168,76,.45); color:var(--gold); }
  .cta-link.secondary:hover { background:rgba(201,168,76,.08); transform:translateY(-1px); }
  .cta-link-label { font-size:.63rem; letter-spacing:.12em; text-transform:uppercase;
                    opacity:.65; display:block; margin-bottom:.25rem; }
  .workbook-box { background:rgba(255,255,255,0.03); border:1px solid var(--border);
                  border-radius:11px; padding:1.4rem 1.65rem; margin-bottom:1.5rem;
                  text-align:left; }
  .workbook-box p { font-size:.93rem; color:var(--text-soft); line-height:1.75;
                    font-weight:300; margin-bottom:.9rem; }
  .workbook-steps { list-style:none; display:flex; flex-direction:column; gap:.45rem;
                    margin-bottom:1.1rem; }
  .workbook-steps li { display:flex; gap:.75rem; align-items:flex-start;
                       font-size:.9rem; color:var(--text-soft); line-height:1.5; }
  .workbook-steps li::before { content:"→"; color:var(--gold); flex-shrink:0; }

  /* Print */
  @media print {
    body { background:#fff; color:#1a1a2e; padding:0; display:block; }
    body::before { display:none; }
    .wrap { max-width:100%; }
    .progress, .hdr, #s0, #s1, #s2, #s3, .btn, .btn-back, .btn-ghost,
    .cta-links, .workbook-box, .ibox-footer { display:none !important; }
    #s4 { display:block !important; }
    .card { background:#f8f7f5; border:1px solid #ddd; color:#1a1a2e;
            animation:none; opacity:1; transform:none; break-inside:avoid; }
    .c-lbl { color:#8a6f2e; }
    .c-txt, .sig-list li { color:#333; }
    .card.botschaft { background:#fdf8ec; border-color:#c9a84c; }
    .card.botschaft .c-txt { color:#8a6f2e; }
    .cta { border-top:1px solid #ddd; }
    .cta-txt { color:#555; }
    .r-title { color:#1a1a2e; }
    .r-lbl { color:#8a6f2e; }
    .dim-dot.on-low, .dim-dot.on-mid { background:#c9a84c; }
    .dim-dot.on-high { background:#c0392b; }
    @page { margin:2cm; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="progress" id="progressBar">
    <div class="progress-steps">
      <div class="step active" id="p0"></div>
      <div class="step-line"></div>
      <div class="step" id="p1"></div>
      <div class="step-line"></div>
      <div class="step" id="p2"></div>
      <div class="step-line"></div>
      <div class="step" id="p3"></div>
    </div>
    <div class="progress-label" id="progressLabel">Schritt 1 von 4</div>
  </div>

  <div class="hdr">
    <span class="lbl">Persönliche Analyse</span>
    <h1>Neustart-<span>Check</span></h1>
    <div class="divider"></div>
    <p class="sub">Wo stehst du gerade. Wirklich.</p>
  </div>

  <!-- Schritt 1: Allgemeine Signale -->
  <div class="section visible" id="s0">
    <div class="ibox">
      <div class="ibox-inner">
        <span class="sec-label">Was ist in den letzten vier Wochen häufiger geworden?</span>
        <div class="cb-group" id="cbGroup0">
          <label class="cb-item">
            <input type="checkbox" id="cb0_1">
            <div class="cb-box"></div>
            <span class="cb-text">Abends schwer abschalten, obwohl alles erledigt ist</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb0_2">
            <div class="cb-box"></div>
            <span class="cb-text">Mehr Gereiztheit bei Kleinigkeiten</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb0_3">
            <div class="cb-box"></div>
            <span class="cb-text">Körper meldet sich: Verspannung, Druck, Unruhe</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb0_4">
            <div class="cb-box"></div>
            <span class="cb-text">Beschäftigt, aber innerlich nicht zufrieden</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb0_5">
            <div class="cb-box"></div>
            <span class="cb-text">Funktioniere nach außen, aber innen ist es laut</span>
          </label>
        </div>

        <div class="signal-bar" id="signalBar">
          <div class="signal-count" id="signalCount">0</div>
          <div class="signal-txt" id="signalTxt"><strong>von 5 Signalen</strong> erkannt</div>
          <div class="signal-dots">
            <div class="signal-dot"></div><div class="signal-dot"></div>
            <div class="signal-dot"></div><div class="signal-dot"></div>
            <div class="signal-dot"></div>
          </div>
        </div>

        <div class="sep">
          <div class="sep-line"></div>
          <span class="sep-txt">Deine Situation</span>
          <div class="sep-line"></div>
        </div>

        <textarea id="userInput" rows="4"
          placeholder="Im Moment kostet mich am meisten Energie: Was läuft nicht mehr rund? Was fühlt sich falsch an?"></textarea>
      </div>
      <div class="ibox-footer">
        <span class="hint">Sei ehrlich. Kein richtig oder falsch.</span>
        <button class="btn" onclick="goNext(0)">Weiter →</button>
      </div>
    </div>
  </div>

  <!-- Schritt 2: Schlaf & Erholung -->
  <div class="section" id="s1">
    <div class="ibox">
      <div class="ibox-inner">
        <span class="sec-label">Bereich Schlaf &amp; Erholung</span>
        <div class="cb-group" id="cbGroup1">
          <label class="cb-item">
            <input type="checkbox" id="cb1_1">
            <div class="cb-box"></div>
            <span class="cb-text">Ich schlafe ein, aber schlafe unruhig oder wache nachts auf</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb1_2">
            <div class="cb-box"></div>
            <span class="cb-text">Morgens bin ich nicht wirklich erholt, obwohl ich genug geschlafen habe</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb1_3">
            <div class="cb-box"></div>
            <span class="cb-text">Ich wache mit Gedanken auf, bevor der Tag angefangen hat</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb1_4">
            <div class="cb-box"></div>
            <span class="cb-text">Mein Körper erholt sich kaum, auch an freien Tagen oder am Wochenende nicht</span>
          </label>
        </div>
      </div>
      <div class="ibox-footer with-back">
        <button class="btn-back" onclick="goBack(1)">← Zurück</button>
        <button class="btn" onclick="goNext(1)">Weiter →</button>
      </div>
    </div>
  </div>

  <!-- Schritt 3: Innerer Druck -->
  <div class="section" id="s2">
    <div class="ibox">
      <div class="ibox-inner">
        <span class="sec-label">Bereich Innerer Druck</span>
        <div class="cb-group" id="cbGroup2">
          <label class="cb-item">
            <input type="checkbox" id="cb2_1">
            <div class="cb-box"></div>
            <span class="cb-text">Morgens bin ich sofort im Modus, bevor der Tag richtig angefangen hat</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb2_2">
            <div class="cb-box"></div>
            <span class="cb-text">Ich fühle Druck auch dann, wenn gerade nichts Akutes ansteht</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb2_3">
            <div class="cb-box"></div>
            <span class="cb-text">Pausen fühlen sich nicht wie echte Erholung an</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb2_4">
            <div class="cb-box"></div>
            <span class="cb-text">Ich habe weniger Energie für Dinge, die mir früher Freude gemacht haben</span>
          </label>
        </div>
      </div>
      <div class="ibox-footer with-back">
        <button class="btn-back" onclick="goBack(2)">← Zurück</button>
        <button class="btn" onclick="goNext(2)">Weiter →</button>
      </div>
    </div>
  </div>

  <!-- Schritt 4: Grübelintensität -->
  <div class="section" id="s3">
    <div class="ibox">
      <div class="ibox-inner">
        <span class="sec-label">Bereich Grübelintensität</span>
        <div class="cb-group" id="cbGroup3">
          <label class="cb-item">
            <input type="checkbox" id="cb3_1">
            <div class="cb-box"></div>
            <span class="cb-text">Gedanken kreisen auch dann, wenn ich eigentlich abschalten möchte</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb3_2">
            <div class="cb-box"></div>
            <span class="cb-text">Ich analysiere Gespräche oder Situationen noch Stunden später</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb3_3">
            <div class="cb-box"></div>
            <span class="cb-text">Abends fällt es mir schwer, den Tag wirklich loszulassen</span>
          </label>
          <label class="cb-item">
            <input type="checkbox" id="cb3_4">
            <div class="cb-box"></div>
            <span class="cb-text">Ich komme kaum zur Ruhe, selbst wenn ich äußerlich still sitze</span>
          </label>
        </div>
      </div>
      <div class="ibox-footer with-back">
        <button class="btn-back" onclick="goBack(3)">← Zurück</button>
        <button class="btn" onclick="showResult()">Meine Auswertung →</button>
      </div>
    </div>
  </div>

  <!-- Auswertung -->
  <div class="section" id="s4"></div>

</div>

<script>
// ---- Hilfsfunktionen ----
function show(id, visible) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('visible', visible);
}

function getCheckedCount(groupId) {
  return document.querySelectorAll('#' + groupId + ' input:checked').length;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---- Fortschritt ----
function updateProgress(step) {
  const labels = ['Schritt 1 von 4','Schritt 2 von 4','Schritt 3 von 4','Schritt 4 von 4'];
  document.getElementById('progressLabel').textContent = step < 4 ? labels[step] : 'Deine Auswertung';
  [0,1,2,3].forEach(i => {
    const el = document.getElementById('p' + i);
    if (!el) return;
    el.classList.toggle('active', i === step);
    el.classList.toggle('done', i < step);
  });
  document.getElementById('progressBar').style.display = step >= 4 ? 'none' : 'block';
}

// ---- Navigation ----
function goNext(fromStep) {
  show('s' + fromStep, false);
  show('s' + (fromStep + 1), true);
  updateProgress(fromStep + 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack(fromStep) {
  show('s' + fromStep, false);
  show('s' + (fromStep - 1), true);
  updateProgress(fromStep - 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---- Signal-Bar (Schritt 1) ----
const SIGNAL_MSGS = [
  '', 'Erstes Signal erkannt. Hör hin.',
  'Zwei Signale. Das ist kein Zufall.',
  '3 von 5: <strong>dein Körper spricht.</strong>',
  '4 von 5. Das ist ein klares Bild.',
  'Alle 5 Signale. <strong>Es ist Zeit hinzuschauen.</strong>'
];

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('#cbGroup0 input').forEach(function(cb) {
    cb.addEventListener('change', updateSignals);
  });
});

function updateSignals() {
  var n = getCheckedCount('cbGroup0');
  document.getElementById('signalCount').textContent = n;
  document.getElementById('signalTxt').innerHTML = n === 0
    ? '<strong>von 5 Signalen</strong> erkannt'

// ---- Dots-HTML ----
function dimDots(n, max, level) {
  var html = '<div class="dim-dots">';
  for (var i = 0; i < max; i++) {
    var cls = i < n ? 'dim-dot on-' + level : 'dim-dot';
    html += '<div class="' + cls + '"></div>';
  }
  html += '</div>';
  return html;
}

function scoreLevel(n, max) {
  var ratio = n / max;
  if (ratio === 0) return 'low';
  if (ratio <= 0.5) return 'mid';
  return 'high';
}

// ---- Reset ----
var lastResult = {};

function generatePDF() {
  if (window._jspdfFailed || !window.jspdf) {
    alert('PDF-Download konnte nicht geladen werden. Bitte öffne die Seite direkt unter ansto-finaffairs.com/standortcheck.html in deinem Browser.');
    return;
  }
  try {
  var doc = new window.jspdf.jsPDF();
  var margin = 20;
  var pageW = doc.internal.pageSize.getWidth();
  var contentW = pageW - margin * 2;
  var y = 22;

  function addSection(label, text, currentY) {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.setTextColor(150, 110, 20);
    doc.text(label, margin, currentY);
    currentY += 6;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(50, 50, 50);
    var lines = doc.splitTextToSize(text, contentW);
    doc.text(lines, margin, currentY);
    return currentY + lines.length * 5 + 8;
  }

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.setTextColor(26, 26, 46);
  doc.text('Dein persönlicher Standortcheck', margin, y);
  y += 8;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(130, 130, 130);
  doc.text(new Date().toLocaleDateString('de-DE', {day:'2-digit', month:'long', year:'numeric'}), margin, y);
  y += 10;
  doc.setDrawColor(201, 168, 76);
  doc.setLineWidth(0.5);
  doc.line(margin, y, pageW - margin, y);
  y += 10;

  y = addSection('Allgemeine Signale', lastResult.einschaetzung || '', y);
  y = addSection('Schlaf & Erholung (' + (lastResult.n1||0) + ' von 4)', lastResult.schlafTxt || '', y);
  y = addSection('Innerer Druck (' + (lastResult.n2||0) + ' von 4)', lastResult.druckTxt || '', y);
  y = addSection('Grübelintensität (' + (lastResult.n3||0) + ' von 4)', lastResult.gruebelTxt || '', y);
  y = addSection('Dein nächster Schritt', lastResult.schritt || '', y);

  doc.setDrawColor(210, 210, 210);
  doc.setLineWidth(0.3);
  doc.line(margin, y, pageW - margin, y);
  y += 8;
  doc.setFont('helvetica', 'italic');
  doc.setFontSize(10);
  doc.setTextColor(90, 90, 90);
  var botLines = doc.splitTextToSize(lastResult.botschaft || '', contentW);
  doc.text(botLines, margin, y);
  y += botLines.length * 5 + 12;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(160, 160, 160);
  doc.text('Neustart im Kopf | Andreas Stock', margin, y);

  doc.save('mein-standortcheck.pdf');
  } catch(e) {
    alert('PDF-Erstellung fehlgeschlagen: ' + e.message + '\nBitte öffne die Seite unter ansto-finaffairs.com/standortcheck.html im Browser.');
  }
}

function resetTool() {
  ['s1','s2','s3','s4'].forEach(function(id) { show(id, false); });
  document.querySelectorAll('input[type=checkbox]').forEach(function(cb) { cb.checked = false; });
  document.getElementById('userInput').value = '';
  document.getElementById('signalBar').classList.remove('visible');
  document.getElementById('signalCount').textContent = '0';
  document.getElementById('signalTxt').innerHTML = '<strong>von 5 Signalen</strong> erkannt';
  document.querySelectorAll('.signal-dot').forEach(function(d) { d.classList.remove('on'); });
  document.getElementById('s4').innerHTML = '';
  document.getElementById('progressBar').style.display = 'block';
  updateProgress(0);
  show('s0', true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
